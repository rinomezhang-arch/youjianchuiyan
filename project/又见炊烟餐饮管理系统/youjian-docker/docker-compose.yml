version: "3.8"

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
  app-logs:

services:
  # MySQL 8.0 数据库服务
  mysql:
    image: mysql:8.0.36
    container_name: youjian-mysql
    restart: always
    env_file: .env
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SpringBoot后端服务
  backend:
    build:
      context: ../banquet_project
      dockerfile: ../youjian-docker/backend/Dockerfile
    container_name: youjian-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      TIANLONG_TOKEN: ${TIANLONG_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - app-logs:/app/logs
    expose:
      - "8080"
    networks:
      - app-network

  # Vue前端+Nginx反向代理服务
  frontend:
    build:
      context: ../frontend_v3
      dockerfile: ../youjian-docker/frontend/Dockerfile
    container_name: youjian-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
