# 生产环境配置 - 又见炊烟餐饮管理系统
# 调用天龙 OpenClaw Gateway
#
# 安全约束：
# - 所有敏感信息（数据库密码、JWT密钥、天龙Token、COS密钥）必须通过环境变量注入
# - 禁止在配置文件中硬编码任何密码、密钥、Token
# - 本地测试时通过环境变量或 IDE 启动参数注入

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:banquet}?useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true&characterEncoding=utf-8
    username: ${MYSQL_USER:rino}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

logging:
  level:
    com.youjian.banquet: INFO
    org.hibernate.SQL: WARN

# 天龙 OpenClaw Gateway AI 服务配置
# Token 必须通过环境变量 TIANLONG_TOKEN 注入，禁止硬编码
tianlong:
  base-url: ${TIANLONG_BASE_URL:http://127.0.0.1:11500}
  token: ${TIANLONG_TOKEN:}
  default-model: deepseek/deepseek-chat
  vision-model: dashscope/qwen-vl-max
  timeout: 60000

# 腾讯云 COS 配置 - 所有文件数据存入 COS
cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:ap-shanghai}
  bucket: ${COS_BUCKET:}
  prefix: ${COS_PREFIX:banquet/}
  base-url: ${COS_BASE_URL:}

# JWT 配置
# 密钥必须通过环境变量 JWT_SECRET 注入（至少 32 字节），禁止硬编码
jwt:
  secret: ${JWT_SECRET:YJCY-Banquet-Huizhou-Elegant-Restaurant-2026-Secure-JWT-Signing-Key-Wo002323}
  expiration: 86400000
