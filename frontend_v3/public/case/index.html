<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>法务管理 · 又见炊烟私房菜</title>
<!-- 本文件是唯一可被静态服务器直出的法务页面，只含登录框，不得写入任何案卷内容。
     案卷正文由后端 GET /api/legal/case 与 /api/legal/case/timeline 鉴权后下发。 -->
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22201c;--ink-3:#6f6a61;--rule:#ded8cc;--seal:#8c2f24}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
     font:15px/1.7 "Noto Serif SC","Songti SC",Georgia,serif;
     display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--rule);
     border-radius:12px;padding:34px 30px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.brand{text-align:center;margin-bottom:26px}
.brand img{height:44px;margin-bottom:12px}
.brand h1{font-size:19px;margin:0 0 4px;letter-spacing:2px}
.brand .rule{width:34px;height:2px;background:var(--seal);margin:12px auto}
.brand h2{font-size:14px;font-weight:400;color:var(--ink-3);margin:0;letter-spacing:3px}
label{display:block;font-size:12.5px;color:var(--ink-3);margin:14px 0 5px}
input{width:100%;padding:10px 12px;font:inherit;font-size:14px;border:1px solid var(--rule);
      border-radius:7px;background:#fdfcfa}
input:focus{outline:none;border-color:var(--seal)}
button{width:100%;margin-top:22px;padding:11px;font:inherit;font-size:15px;letter-spacing:4px;
       color:#fff;background:var(--seal);border:0;border-radius:7px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{min-height:20px;margin-top:12px;font-size:13px;color:var(--seal);text-align:center}
.note{margin-top:18px;font-size:11.5px;line-height:1.75;color:var(--ink-3);
      border-top:1px solid var(--rule);padding-top:14px}
.foot{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <img src="/logo.png" alt="又见炊烟" onerror="this.style.display='none'">
    <h1>又见炊烟私房菜</h1>
    <div class="rule"></div>
    <h2>法务管理</h2>
  </div>
  <form autocomplete="off" onsubmit="return false">
    <label for="gu">账号</label>
    <input id="gu" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" name="lgl-acct-x" placeholder="姓名 / 拼音 / 英文名 / 手机号">
    <label for="gp">密码</label>
    <input id="gp" type="password" autocomplete="new-password" name="lgl-pw-x" placeholder="请输入访问密码">
    <button id="gbtn" type="button">进 入 案 卷</button>
  </form>
  <div class="err" id="gerr"></div>
  <div class="note">本卷含诉讼材料与当事人个人信息，仅限授权人员查阅，<b>请勿转发、勿截屏外传。</b>
    为避免留痕，本页不保存密码、不使用浏览器自动填充，关闭标签页即退出登录。</div>
</div>
<div class="foot">案件工作卷 · 授权人员登录后查阅</div>

<script>
(function () {
  var CASE_URL = "/api/legal/case";

  function el(id) { return document.getElementById(id); }
  function fail(msg) {
    el("gerr").textContent = msg || "登录失败";
    el("gbtn").disabled = false;
    el("gbtn").textContent = "进 入 案 卷";
  }

  function doLogin() {
    var u = el("gu").value.trim();
    var p = el("gp").value;
    // 硬约束：账号或密码为空绝不发起登录请求，禁止无密码进入
    if (!u || !p.trim()) { el("gerr").textContent = "请输入账号和密码"; return; }
    el("gerr").textContent = "";
    el("gbtn").disabled = true;
    el("gbtn").textContent = "登录中…";

    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.code !== 200 || !j.data || !j.data.token) {
        throw new Error(j.message || "账号或密码错误");
      }
      var tk = j.data.token;
      el("gp").value = "";                       // 不在 DOM 里留密码
      try { sessionStorage.setItem("legalTok", tk); } catch (e) {}
      // 用凭证换取案卷会话 Cookie：后端在此校验角色是否在 legal.allowed-roles 内
      return fetch("/api/legal/case-session", {
        method: "POST",
        headers: { "Authorization": "Bearer " + tk }
      }).then(function (r) { return r.json(); }).then(function (s) {
        if (s.code !== 200) throw new Error(s.message || "无权查阅本案卷");
        location.replace(CASE_URL);
      });
    }).catch(function (e) {
      try { sessionStorage.removeItem("legalTok"); } catch (x) {}
      fail(e && e.message);
    });
  }

  el("gbtn").onclick = doLogin;
  el("gp").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
  el("gu").addEventListener("keydown", function (e) { if (e.key === "Enter") el("gp").focus(); });
})();
</script>
</body>
</html>
