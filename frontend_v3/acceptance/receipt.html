<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入库验收 · 隔离测试</title></head>
<body><div id="app"></div><script type="module">
import { createApp } from 'vue'
import { createPinia } from 'pinia'
import ElementPlus from 'element-plus'
import 'element-plus/dist/index.css'
import Receipt from '/src/views/dashboard/Receipt.vue'
import CostRecipe from '/src/views/dashboard/CostRecipe.vue'
import Issue from '/src/views/dashboard/Issue.vue'
localStorage.setItem('storeId', '1')
localStorage.setItem('currentStoreId', '1')
const view=new URLSearchParams(location.search).get('view')
const app=createApp(view==='cost'?CostRecipe:view==='issue'?Issue:Receipt)
app.use(createPinia()).use(ElementPlus).mount('#app')
</script><style>body{margin:0;font-family:system-ui,sans-serif;background:#f8fafc;color:#172033}#app{padding:24px}</style></body></html>
