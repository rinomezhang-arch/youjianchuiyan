# 生产环境配置 - 又见炊烟餐饮管理系统
# 调用天龙 OpenClaw Gateway
#
# 安全约束：
# - 所有敏感信息（数据库密码、JWT密钥、天龙Token、COS密钥）必须通过环境变量注入
# - 禁止在配置文件中硬编码任何密码、密钥、Token
# - 本地测试时通过环境变量或 IDE 启动参数注入

fallback:
  mode: prod

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:banquet}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&allowMultiQueries=true&characterEncoding=utf-8
    username: ${MYSQL_USER:rino}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

logging:
  level:
    com.youjian.banquet: INFO
    org.hibernate.SQL: WARN

# AI 云端网关配置（AgentGatewayService）
# 文本对话/工具调用走天龙的 OpenClaw 网关（生产服务器本机 127.0.0.1:11500，与后端同机部署，
# 已实测支持自定义工具透传）。model 字段填 agent 目标：openclaw/main（超管/总经理）、
# openclaw/tom（普通员工）——不是底层模型名，网关自己路由。
# Token 必须通过环境变量 TIANLONG_TOKEN 注入，禁止硬编码。
tianlong:
  base-url: ${TIANLONG_BASE_URL:http://127.0.0.1:11500}
  token: ${TIANLONG_TOKEN:}

# 视觉理解暂时仍走百炼 Dashscope 直连（天龙网关未确认有对应视觉 agent）
dashscope:
  base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${DASHSCOPE_API_KEY:}
  vision-model: qwen-vl-max

# 视觉理解改走 DeepSeek 官方多模态模型直连，见 AgentGatewayService 注释——
# 2026-09-02 实测：百炼那几把 workspace 代理 key 直连官方接口一律 401，天龙网关明确拒绝 image_url；
# DeepSeek 官方 key（跟文字对话共用同一把）+ deepseek-v4-flash-vision-exp 实测返回正确结果。
deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${DEEPSEEK_API_KEY:}
  vision-model: deepseek-v4-flash-vision-exp

# 企业微信"智能机器人"URL回调（客服AI）签名校验+解密用的 Token / EncodingAESKey，
# 在企业微信管理后台该机器人的"连接方式"里点"随机获取"生成，必须通过环境变量注入，禁止硬编码。
wecom:
  aibot:
    token: ${WECOM_AIBOT_TOKEN:}
    encoding-aes-key: ${WECOM_AIBOT_ENCODING_AES_KEY:}
  aibot-tom:
    token: ${WECOM_AIBOT_TOM_TOKEN:}
    encoding-aes-key: ${WECOM_AIBOT_TOM_ENCODING_AES_KEY:}
  aibot-main:
    token: ${WECOM_AIBOT_MAIN_TOKEN:}
    encoding-aes-key: ${WECOM_AIBOT_MAIN_ENCODING_AES_KEY:}
    allowed-userid: ${WECOM_AIBOT_MAIN_ALLOWED_USERID:}
  aibot-zhangjing:
    token: ${WECOM_AIBOT_ZHANGJING_TOKEN:}
    encoding-aes-key: ${WECOM_AIBOT_ZHANGJING_ENCODING_AES_KEY:}

# 微信小程序（顾客端）配置——AppSecret必须走环境变量，禁止硬编码
wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID:}
    app-secret: ${WECHAT_MINIAPP_APP_SECRET:}

# 微信支付（宴会定金）——用官方 wechatpay-java SDK，证书模式（RSAAutoCertificateConfig 自动拉取并缓存
# 微信支付平台证书，不需要手动下载"微信支付公钥"那个文件，只要商户号+私钥+证书序列号+APIv3密钥四样）
wxpay:
  mch-id: ${WXPAY_MCH_ID:}
  cert-serial-no: ${WXPAY_CERT_SERIAL_NO:}
  api-v3-key: ${WXPAY_API_V3_KEY:}
  private-key-path: ${WXPAY_PRIVATE_KEY_PATH:}
  notify-url: ${WXPAY_NOTIFY_URL:}
  # 定金金额固定¥200（20000分），阶梯退款比例参照酒店/宴会行业惯例，见 RefundPolicy 注释
  deposit-amount-fen: 20000

# 顾客JWT签名密钥，跟员工JWT_SECRET物理隔离（见 CustomerJwtUtil 注释）
customer:
  jwt:
    secret: ${CUSTOMER_JWT_SECRET:}

# 腾讯云 COS 配置 - 所有文件数据存入 COS
cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:ap-shanghai}
  bucket: ${COS_BUCKET:}
  prefix: ${COS_PREFIX:banquet/}
  base-url: ${COS_BASE_URL:}

# CORS 配置 - 允许 HTTPS 前端访问
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://youjianchuiyan.com,https://www.youjianchuiyan.com,http://youjianchuiyan.com,http://www.youjianchuiyan.com,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# JWT 配置
# 密钥必须通过环境变量 JWT_SECRET 注入（至少 32 字节），禁止硬编码
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# AES 加密配置（P1-14 银行账号/身份证号加密）
# 密钥必须通过环境变量 AES_SECRET_KEY 注入（32字节 = AES-256），无默认值
aes:
  secret-key: ${AES_SECRET_KEY}

# 实时通知配置 — 启用 MQ + WebSocket 通知链路
app:
  notify:
    enabled: true
    queue: youjian.notify.queue
    exchange: youjian.notify.exchange
    routing-key: notify.event


# =====================================================================
# 追加到 banquet_project/src/main/resources/application-prod.yml 末尾
# =====================================================================

# 法务案卷（宁国店消防改造合同纠纷）
# 登录复用花名册 staff_master + /api/auth/login，这里不配账号密码。
legal:
  enabled: ${LEGAL_ENABLED:true}
  # 允许查阅案卷的花名册角色。律师是 lawyer；超管/总经理一并放行。
  allowed-roles: ${LEGAL_ALLOWED_ROLES:lawyer,gm,super_admin,admin}

  # 案卷证据所在的 COS 桶。与业务桶不是同一个：这个桶私有读写，
  # 只用来出短时效预签名链接，不放公开访问的业务附件。
  cos:
    secret-id: ${LEGAL_COS_SECRET_ID:${COS_SECRET_ID:}}
    secret-key: ${LEGAL_COS_SECRET_KEY:${COS_SECRET_KEY:}}
    region: ${LEGAL_COS_REGION:ap-nanjing}
    bucket: ${LEGAL_COS_BUCKET:youjian-data-1409286104}
    root: ${LEGAL_COS_ROOT:法务/2026-宁国店消防合同纠纷/}
    # 证据链接有效期（秒）。刻意设短：链接转发出去很快就失效。
    url-expire-seconds: ${LEGAL_COS_URL_EXPIRE:900}

  # 案情问答。key 只在服务器上，浏览器永远拿不到。
  ai:
    base-url: ${LEGAL_AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LEGAL_AI_API_KEY:}
    model: ${LEGAL_AI_MODEL:deepseek-v4-pro}
