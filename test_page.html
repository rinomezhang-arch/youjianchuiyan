<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测试页面</title>
  <style>
    body {
      background: #f5f3ef;
      font-family: sans-serif;
      padding: 20px;
    }
    .test-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .success {
      color: #4A7C59;
      font-weight: bold;
    }
    .error {
      color: #C25555;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>测试页面 - Test Page</h1>
    <p>这是一个简单的测试页面，用于验证服务器是否正常工作。</p>
    <p class="success">服务器运行正常！✅</p>
    <p>如果您看到这个页面，说明Nginx和静态文件服务正常。</p>
  </div>
</body>
</html>
